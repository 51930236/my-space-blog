# Hexo 配置文件
## 文档: https://hexo.io/zh-cn/docs/configuration.html
## 源码: https://github.com/hexojs/hexo/

# 网站信息
## 这些信息会显示在网站标题、页脚等位置
title: Hexo # 网站主标题
subtitle: '' # 网站副标题
description: '' # 网站描述，用于SEO和首页介绍
keywords: # 网站关键词，用于SEO
author: John Doe # 网站作者，显示在文章或页脚
language: zh-CN # 网站语言，可改为 zh-CN 使用中文
timezone: '' # 网站时区，留空则使用系统时区，可设为 'Asia/Shanghai'

# 网址设置
## 请将 url 设置为你自己的网站地址，例如 GitHub Pages 项目页
url: http://example.com # 网站根地址，必须与部署地址一致
permalink: :year/:month/:day/:title/ # 文章永久链接格式
permalink_defaults: # 永久链接各部分的默认值
pretty_urls:
  trailing_index: true # 是否保留永久链接末尾的 'index.html'
  trailing_html: true # 是否保留永久链接末尾的 '.html'

# 目录设置
source_dir: source # 源文件存放目录，即存放文章、页面、资源的文件夹
public_dir: public # 生成的静态网页输出目录
tag_dir: tags # 标签页面存放的目录
archive_dir: archives # 归档页面存放的目录
category_dir: categories # 分类页面存放的目录
code_dir: downloads/code # 代码文件存放目录
i18n_dir: :lang # 国际化（多语言）目录结构
skip_render: # 跳过渲染的文件或文件夹，可写正则

# 文章写作设置
new_post_name: :title.md # 新建文章时默认的文件名格式
default_layout: post # 新建文章时的默认布局，可选 post, page, draft
titlecase: false # 是否自动将文章标题转换为标题大小写格式
external_link: # 外部链接设置
  enable: true # 是否在新标签页中打开外部链接
  field: site # 适用范围，site 表示全站，post 表示仅文章
  exclude: '' # 需要排除的链接（域名）
filename_case: 0 # 新建文章时文件名的大小写转换，0-不转换，1-转小写，2-转大写
render_drafts: false # 是否渲染草稿（_drafts文件夹内的文章）
post_asset_folder: false # 是否创建资源文件夹，开启后新建文章会生成同名文件夹用于存放图片等
relative_link: false # 链接是否使用相对路径
future: true # 是否显示未来日期的文章
syntax_highlighter: highlight.js # 语法高亮器，可选 highlight.js 或 prismjs
highlight: # highlight.js 高亮设置
  line_number: true # 是否显示行号
  auto_detect: false # 是否自动检测语言
  tab_replace: '' # 替换Tab键的字符
  wrap: true # 是否自动换行
  hljs: false # 是否只使用hljs类（如果为true，则禁用行号等）
prismjs: # PrismJS 高亮设置（需切换 syntax_highlighter）
  preprocess: true # 是否预处理代码块
  line_number: true # 是否显示行号
  tab_replace: '' # 替换Tab键的字符

# 首页设置
index_generator: # 首页生成器配置
  path: '' # 首页路径，默认为根目录
  per_page: 10 # 每页显示的文章数量（设为0则不分页）
  order_by: -date # 文章排序方式，-date 表示按日期倒序

# 分类 & 标签
default_category: uncategorized # 文章未指定分类时的默认分类
category_map: # 分类别名映射，可将分类名映射为实际路径
tag_map: # 标签别名映射

# 元数据元素
## 控制是否生成HTML <meta> 标签
meta_generator: true # 是否生成 <meta name="generator"> 标签

# 日期 / 时间格式
## Hexo 使用 Moment.js 解析和显示日期
date_format: YYYY-MM-DD # 日期格式
time_format: HH:mm:ss # 时间格式
## updated_option 指定文章更新时间的取值方式
## 'mtime' 使用文件修改时间，'date' 使用 front-matter 中的 date，'empty' 则不显示
updated_option: 'mtime'

# 分页设置
per_page: 10 # 每页显示的文章数量，设为0可禁用分页
pagination_dir: page # 分页目录名，例如 /page/2/

# 包含 / 排除文件
## include/exclude 选项只适用于 'source/' 文件夹
include: # 指定渲染时包含的文件或文件夹
exclude: # 指定渲染时排除的文件或文件夹
ignore: # 指定完全忽略的文件或文件夹

# 扩展设置
## 这里安装插件和主题
## 主题: https://hexo.io/themes/
theme: redefine # 当前使用的主题名称，请确保主题已正确安装

# 部署设置
## 一键部署到GitHub Pages等平台
## 文档: https://hexo.io/docs/one-command-deployment
deploy:
  type: '' # 部署类型，如 'git'，留空则不启用
  # repo: ''              # 仓库地址，例如 'git@github.com:用户名/用户名.github.io.git'
  # branch: ''            # 分支名称，例如 'main' 或 'gh-pages'
